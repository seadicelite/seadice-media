# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# プレビューはPRで変わったサイトだけに作り、2日で消す。
# 全サイトに作るとPR1本で21サイト分のチャネル×各10版がたまり、Hostingの容量上限（429）に達した（2026-10-09）

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed sites
        id: sites
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          changed = open('changed.txt').read().split()
          sites = [h['site'] for h in json.load(open('firebase.json'))['hosting']
                   if any(p.startswith(h['public'].rstrip('/') + '/') for p in changed)]
          print('only=' + ','.join(sites))
          EOF
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: ${{ steps.sites.outputs.only != '' }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEADICEWEB }}
          projectId: seadiceweb
          target: ${{ steps.sites.outputs.only }}
          expires: 2d
