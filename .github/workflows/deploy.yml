name: Deploy media sites to Firebase Hosting
on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # 毎日0:00(JST)。日付シードで表示順を入れ替えるため毎日ビルドし直す
  push:
    branches: [main]
    paths: ["sites/**", "media/**", "firebase.json"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rebuild index pages (daily rotation)
        run: for s in research umbra ledger kogei tetsugaku bohan kosodate kokoro tantei hanzai; do python3 media/build.py "$s"; done; python3 media/shinri_pages.py; python3 media/study.py --all
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEADICEWEB }}
          channelId: live
          projectId: seadiceweb
      - name: Notify IndexNow (Bing etc.) of updated articles
        if: github.event_name == 'push'
        run: python3 media/indexnow.py $(git diff --name-only HEAD~1 HEAD) || true
